g.fillStyle='#d4ee3a';g.fillRect(0,112,256,32);g.fillStyle='#e6eaee';g.fillRect(0,122,256,12);ge.fillStyle='#555f10';ge.fillRect(0,112,256,32);ge.fillStyle='#ffffff';ge.fillRect(0,122,256,12);

g.textAlign='center';g.textBaseline='middle';rr(g,52,40,152,34,14);g.fillStyle='#f4f1ea';g.fill();g.fillStyle='#7d1612';g.font='bold 21px sans-serif';g.fillText('FIREFIGHTER',128,58);

// Corps, gilet, ceinture, col

add(mk(conform([dome],V(0,30.6,-1.2),V(0,0,1),Y,2.6,2.6,10,V(1,0,0),0.1),mDisc));
add(mk(conform([dome],V(0,30.6,-1.2),V(0,0,-1),Y,2.6,2.6,10,V(-1,0,0),0.1),mDisc));
const hc=V(0,24.6,0.6),Dc=V(0,-0.8,0.6).normalize();const cs=[V(-10.6,27.0,0.6)];
for(let a=-90;a<=90;a+=10){const t=a*Math.PI/180;const d=X.clone().multiplyScalar(Math.sin(t)).addScaledVector(Dc,Math.cos(t)).normalize();const h=hitAt([hairS,head],hc.clone().addScaledVector(d,40),d.clone().negate());if(h)cs.push(h.p.addScaledVector(d,0.25));}
cs.push(V(10.6,27.0,0.6));add(mk(new THREE.TubeGeometry(new THREE.CatmullRomCurve3(cs),120,0.18,8,false),mBlack));

// Lunettes (sur les yeux ou relevées sur le casque)
function goggles(par,tgt,y,k,e0){for(const s of[-1,1]){const fr=mk(new THREE.TorusGeometry(2.0,0.4,12,40),mFrame);stick(fr,tgt,s*3.7*k,y,e0,par);fr.scale.set(1.18*k,0.95*k,k);
const ln=stick(mk(blob(2.25,1.85,0.45,{lump:0}),mLens),tgt,s*3.7*k,y,e0-0.25,par);ln.scale.setScalar(k);}
stick(mk(blob(1.0*k,0.45*k,0.4*k,{lump:0}),mFrame),tgt,0,y+0.3*k,e0-0.15,par);}
goggles(gEye,[head],24.1,1,-0.3);
const sg=new THREE.Group();const sm=mk(new THREE.TorusGeometry(10.45,0.42,10,80,Math.PI+1.6),mBlack);sm.rotation.x=-Math.PI/2;sm.scale.set(1,0.94,1);sg.add(sm);sg.position.set(0,24.1,0.6);sg.rotation.y=-0.8;gEye.add(sg);
goggles(gHelm,[dome],28.75,0.82,-0.25);
const hs=mk(new THREE.TorusGeometry(10.5,0.4,10,96),mBlack);hs.position.set(0,28.3,-0.4);hs.rotation.x=Math.PI/2;hs.scale.set(1,0.94,1);gHelm.add(hs);

// Micro-casque
add(mk(blob(1.3,1.9,1.7,{lump:0}),mBlack),[-10.1,24.0,0.8]);
const bpts=[V(-10.4,23.2,2.0),V(-9.3,21.8,5.2),V(-6.5,20.9,8.0),V(-3.6,20.4,9.3),V(-2.0,20.5,9.5)];
add(mk(new THREE.TubeGeometry(new THREE.CatmullRomCurve3(bpts),60,0.18,8,false),mBlack));
add(mk(blob(0.55,0.5,0.55,{lump:0.06}),mBlack),[-2.0,20.5,9.5]);

// Bras, gants
for(const s of[-1,1]){const a=add(mk(blob(2.8,5.1,2.8),s<0?mSleeveL:mSleeveR),[s*6.6,11.3,3.8],[-0.85,0,-s*0.45]);
const gl=mk(blob(1.75,1.65,1.75),mGlove);gl.position.set(0,-4.8,0);a.add(gl);const th=mk(blob(0.6,0.95,0.6,{lump:0}),mGlove);th.position.set(-s*1.3,-4.1,0.9);th.rotation.z=s*0.5;a.add(th);
const cf=mk(new THREE.TorusGeometry(1.75,0.35,10,32),mGlove);cf.position.set(0,-4.0,0);cf.rotation.x=Math.PI/2;a.add(cf);}

// Jambes, bottes
for(const s of[-1,1]){const rot=[0,s*0.25,0];const leg=add(mk(blob(3.3,2.9,4.0),mPants),[s*4.6,2.9,4.6],rot);
const b=leg.localToWorld(V(0,0,3.3));add(mk(blob(3.0,2.95,2.1),mBoot),[b.x,b.y,b.z],rot);const so=leg.localToWorld(V(0,0,5.3));add(mk(blob(2.6,2.5,0.4,{lump:0}),mSole),[so.x,so.y,so.z],rot);}

// Équipement du gilet
for(const s of[-1,1]){const pk=new THREE.Group();pk.add(mk(blob(2.6,1.6,0.8,{lump:0.01}),mOrangeD));const fl=mk(blob(2.7,0.55,0.85,{lump:0}),mOrangeD);fl.position.set(0,1.3,0.1);pk.add(fl);stick(pk,[vest],s*3.4,8.5,0.4);
add(mk(conform([vest],V(s*3,13.9,0),X,Y,1.0,5.6,12,FWD,0.15),mBlack));stick(mk(blob(0.75,0.95,0.25,{lump:0}),mSilver),[vest],s*3,13.6,-0.15);}
add(mk(conform([vest],V(-0.3,12.8,0),V(0.5,-0.867,0),V(0.867,0.5,0),1.1,13.6,24,FWD,0.28),mBlack));
const rad=new THREE.Group();rad.add(mk(blob(1.25,1.8,0.7,{lump:0}),mLime));const an=mk(new THREE.CylinderGeometry(0.15,0.15,1.6,8),mBlack);an.position.set(0.5,2.4,0);rad.add(an);
const kn=mk(new THREE.CylinderGeometry(0.28,0.28,0.5,12),mBlack);kn.position.set(-0.5,1.95,0);rad.add(kn);const scr=mk(new THREE.BoxGeometry(1.4,0.9,0.12),mScreen);scr.position.set(0,0.5,0.68);rad.add(scr);stick(rad,[vest],-4.8,14.2,0.3);
add(mk(conform([vest],V(5.4,13.2,0),X,Y,2.4,2.4,10,FWD,0.12),mPatch));
const bc=new THREE.Group();bc.add(mk(blob(1.0,1.3,0.55,{lump:0}),mBlack));const lens=mk(new THREE.CylinderGeometry(0.38,0.38,0.2,16),mScreen);lens.rotation.x=Math.PI/2;lens.position.set(0,0.4,0.55);bc.add(lens);
const led=new THREE.Mesh(new THREE.SphereGeometry(0.12,8,8),new THREE.MeshBasicMaterial({color:0xff3030}));led.position.set(0.55,0.9,0.45);bc.add(led);stick(bc,[vest],0.9,11.8,0.25);
add(mk(blob(1.5,2.3,2.4,{lump:0,sq:0.5}),mBag),[9.3,6.8,1.2]);
add(mk(new THREE.BoxGeometry(0.08,2.2,1.5),mTag),[-7.0,2.4,-2.5],[0,0,-0.35]);

// Lance à incendie
const bar=mk(new THREE.CylinderGeometry(0.7,0.75,5.8,24),mRed);bar.rotation.z=Math.PI/2;bar.position.set(-0.7,7.9,9.5);hose.add(bar);
const grip=mk(blob(0.55,1.25,0.6,{lump:0}),mRed);grip.position.set(-2.7,6.7,9.5);grip.rotation.z=0.25;hose.add(grip);
const bale=mk(new THREE.TorusGeometry(1.0,0.17,8,20,Math.PI),mBlack);bale.position.set(0.4,7.9,9.5);hose.add(bale);
const ring=mk(new THREE.TorusGeometry(0.9,0.3,10,24),mSilver);ring.rotation.y=Math.PI/2;ring.position.set(2.3,7.9,9.5);hose.add(ring);
const fog=mk(new THREE.CylinderGeometry(1.2,0.95,1.1,28),mGray);fog.rotation.z=-Math.PI/2;fog.position.set(3.1,7.9,9.5);hose.add(fog);
const teeth=mk(new THREE.TorusGeometry(0.72,0.13,8,24),mBlack);teeth.rotation.y=Math.PI/2;teeth.position.set(3.68,7.9,9.5);hose.add(teeth);
const hp=[V(-3.6,7.9,9.5),V(-4.8,7.5,10.8),V(-7.0,5.8,12.0),V(-9.4,3.0,11.2),V(-10.6,0.6,8.6),V(-10.2,0.6,5.6),V(-11.6,0.6,3.2)];
hose.add(mk(new THREE.TubeGeometry(new THREE.CatmullRomCurve3(hp),120,0.55,12,false),mRed));
bear.scale.setScalar(0.75);
key.position.set(30,36,72);hemi.intensity=0.62;mSkin.bumpScale=0.08;
const camFill=new THREE.DirectionalLight(0xfff6ee,0.42);scene.add(camFill);

const q=new URLSearchParams(location.search);
gEye.visible=q.get('lunettes')!=='casque';gHelm.visible=!gEye.visible;hose.visible=q.get('lance')!=='non';
const reduce=window.matchMedia&&window.matchMedia('(prefers-reduced-motion: reduce)').matches;
const autoSpin=q.get('tourne')!=='non'&&!reduce;
const TGT=V(0,13.5,0),AZ=0.34,START={ry:-0.25,el:0.24,zoom:1};
let ry=START.ry,el=START.el,zoom=START.zoom,idle=0;
const clamp=(v,a,b)=>Math.min(b,Math.max(a,v));
function fit(){const w=window.innerWidth||400,h=window.innerHeight||400;r.setSize(w,h,false);cam.aspect=w/h;cam.updateProjectionMatrix();}
fit();window.addEventListener('resize',fit);

// Souris et doigts : glisser pour tourner, deux doigts ou molette pour zoomer
const cvs=r.domElement,pts=new Map();
cvs.addEventListener('pointerdown',e=>{cvs.setPointerCapture(e.pointerId);pts.set(e.pointerId,[e.clientX,e.clientY]);cvs.classList.add('drag');idle=performance.now();});
cvs.addEventListener('pointermove',e=>{const p=pts.get(e.pointerId);if(!p)return;idle=performance.now();
if(pts.size===2){const[a,b]=[...pts.values()],d0=Math.hypot(a[0]-b[0],a[1]-b[1]);pts.set(e.pointerId,[e.clientX,e.clientY]);const[c,d]=[...pts.values()],d1=Math.hypot(c[0]-d[0],c[1]-d[1]);if(d0>0&&d1>0)zoom=clamp(zoom*d0/d1,0.6,1.6);return;}
ry+=(e.clientX-p[0])*0.01;el=clamp(el+(e.clientY-p[1])*0.006,-0.15,0.8);pts.set(e.pointerId,[e.clientX,e.clientY]);});
const up=e=>{pts.delete(e.pointerId);if(!pts.size)cvs.classList.remove('drag');idle=performance.now();};
cvs.addEventListener('pointerup',up);cvs.addEventListener('pointercancel',up);
cvs.addEventListener('wheel',e=>{e.preventDefault();zoom=clamp(zoom*Math.exp(e.deltaY*0.001),0.6,1.6);idle=performance.now();},{passive:false});
cvs.addEventListener('dblclick',()=>{ry=START.ry;el=START.el;zoom=START.zoom;});

(function loop(now){now=now||0;
if(autoSpin&&!pts.size&&now-idle>2500)ry+=0.006;
const d=86*Math.max(1,0.9/cam.aspect)*zoom;
cam.position.set(TGT.x+d*Math.sin(AZ)*Math.cos(el),TGT.y+d*Math.sin(el),TGT.z+d*Math.cos(AZ)*Math.cos(el));cam.lookAt(TGT);camFill.position.copy(cam.position);
bear.rotation.y=ry;r.render(scene,cam);requestAnimationFrame(loop);})();
</script>
</body>
